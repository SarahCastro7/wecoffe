<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../CSS/makeItem.css">
    <title>WeCoffee - Criar produto</title>
</head>

<body>
    <header>
        <div class="user-img">
            <img src="" alt="" id="user-img">
        </div>

        <button><a href="../index.html">SAIR</a></button>
    </header>

    <main>
        <form class="product-form" action="#">
            <div class="image-field">
                <span class="field-title">Imagem do Produto:</span>

                <label for="product-img" class="image-box">
                    <img src="" alt="" id="product-preview" hidden>
                </label>
                <input type="file" id="product-img" name="image" accept="image/*" class="visually-hidden">
            </div>

            <!-- Coluna direita: campos -->
            <div class="fields">
                <div class="field">
                    <label for="product-name">Nome do produto:</label>
                    <input type="text" id="product-name" name="name">
                </div>

                <div class="field">
                    <label for="product-desc">Informações do Produto:</label>
                    <textarea id="product-desc" name="description"></textarea>
                </div>

                <div class="field">
                    <label for="product-type">Tipo de produto:</label>
                    <input type="text" id="product-type" name="type">
                </div>

                <div class="row">
                    <div class="field">
                        <label for="product-price">Preço:</label>
                        <div class="price-input">
                            <span>R$</span>
                            <input type="number" id="product-price" name="price" min="0" step="0.01">
                        </div>
                    </div>

                    <div class="field">
                        <label for="product-qty">Quantidade:</label>
                        <div class="qty-input">
                            <button type="button" id="qty-minus" aria-label="Diminuir quantidade">-</button>
                            <input type="number" id="product-qty" name="quantity" value="1" min="1">
                            <button type="button" id="qty-plus" aria-label="Aumentar quantidade">+</button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="create-btn">CRIAR</button>
            </div>
        </form>
    </main>
</body>

</html>
